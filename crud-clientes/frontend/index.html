<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Clientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Gerenciador de Clientes</h1>
    <p>Cadastre, consulte, edite e exclua clientes.</p>
  </header>

  <main class="container">
    <div id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></div>

    <section class="cartao">
      <h2 id="titulo-form">Novo cliente</h2>
      <form id="form-cliente" novalidate>
        <input type="hidden" id="cliente-id">

        <div class="campo">
          <label for="nome">Nome *</label>
          <input type="text" id="nome" name="nome" placeholder="Ex.: Maria Silva" required>
          <small class="erro" id="erro-nome"></small>
        </div>

        <div class="campo">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" placeholder="maria@email.com" required>
          <small class="erro" id="erro-email"></small>
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(11) 91234-5678">
        </div>

        <div class="acoes">
          <button type="submit" id="btn-salvar" class="btn btn-primario">Cadastrar</button>
          <button type="button" id="btn-cancelar" class="btn btn-secundario" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="cartao">
      <h2>Clientes cadastrados <span id="contador" class="contador">0</span></h2>
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th class="col-acoes">Ações</th>
            </tr>
          </thead>
          <tbody id="lista-clientes"></tbody>
        </table>
      </div>
      <p id="vazio" class="vazio" hidden>Nenhum cliente cadastrado.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
